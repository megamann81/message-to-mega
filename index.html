    <style>

        /* =========================================================
           VARIABLES
           ========================================================= */

        :root {
            --background: #f5f3ee;
            --foreground: #171717;
            --muted: #737373;
            --muted-light: #a3a3a3;
            --border: #d4d1ca;
            --surface: #faf9f6;
            --pinned-surface: #ebe8df;

            --max-width: 1080px;

            --serif:
                "Playfair Display",
                Georgia,
                serif;

            --sans:
                "Space Grotesk",
                Arial,
                sans-serif;

            --mono:
                "DM Mono",
                monospace;
        }


        /* =========================================================
           RESET
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--foreground);
            font-family: var(--sans);
            line-height: 1.5;
            overflow-x: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        .container {
            width: min(
                calc(100% - 32px),
                var(--max-width)
            );

            margin-inline: auto;
        }


        /* =========================================================
           ANIMATIONS
           ========================================================= */

        @keyframes pageFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform:
                    translateY(28px)
                    scale(.98);
                filter: blur(6px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
                filter: blur(0);
            }
        }

        @keyframes lineExpand {
            from {
                transform: scaleX(0);
                opacity: 0;
            }

            to {
                transform: scaleX(1);
                opacity: 1;
            }
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(22px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shine {
            0% {
                transform:
                    translateX(-130%)
                    skewX(-20deg);
            }

            45%,
            100% {
                transform:
                    translateX(260%)
                    skewX(-20deg);
            }
        }

        @keyframes subtlePulse {
            0%,
            100% {
                opacity: .65;
            }

            50% {
                opacity: 1;
            }
        }

        body {
            animation:
                pageFade .8s ease both;
        }


        /* =========================================================
           ORNAMENT
           ========================================================= */

        .rule-ornament {
            position: relative;
            height: 5px;

            border-top:
                1px solid var(--foreground);

            border-bottom:
                1px solid var(--foreground);
        }

        .rule-ornament::after {
            content: "";

            position: absolute;
            left: 50%;
            top: 50%;

            width: 7px;
            height: 7px;

            background: var(--background);

            border-left:
                1px solid var(--foreground);

            border-top:
                1px solid var(--foreground);

            transform:
                translate(-50%, -50%)
                rotate(45deg);

            transition:
                transform .5s
                cubic-bezier(.2,.8,.2,1);
        }

        .rule-ornament:hover::after {
            transform:
                translate(-50%, -50%)
                rotate(225deg)
                scale(1.15);
        }


        /* =========================================================
           HEADER
           ========================================================= */

        header {
            padding: 46px 0 30px;
        }

        .header-inner {
            text-align: center;
        }

        .header-rule {
            margin-bottom: 42px;

            animation:
                lineExpand
                1.1s
                cubic-bezier(.16,1,.3,1)
                .1s
                both;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 13px;

            font-size: 10px;
            line-height: 1;

            text-transform: uppercase;
            letter-spacing: .3em;

            color: var(--muted);

            animation:
                floatIn
                .7s
                ease
                .25s
                both;
        }

        .site-title {
            margin: 0;

            font-family: var(--serif);

            font-size:
                clamp(42px, 7vw, 72px);

            line-height: .98;
            letter-spacing: -.04em;

            font-weight: 700;

            animation:
                titleReveal
                1s
                cubic-bezier(.16,1,.3,1)
                .25s
                both;
        }

        .site-title em {
            font-style: italic;
            font-weight: 500;
        }

        .site-subtitle {
            width: min(100%, 550px);

            margin: 18px auto 0;

            font-family: var(--serif);

            font-size: 16px;
            line-height: 1.65;

            font-style: italic;
            color: var(--muted);

            animation:
                floatIn
                .8s
                ease
                .55s
                both;
        }


        /* =========================================================
           SECTIONS
           ========================================================= */

        section {
            padding: 80px 0;

            opacity: 0;
            transform: translateY(28px);

            transition:
                opacity .8s cubic-bezier(.16,1,.3,1),
                transform .8s cubic-bezier(.16,1,.3,1);
        }

        section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-label-row {
            display: flex;
            align-items: center;

            gap: 16px;
            margin-bottom: 34px;
        }

        .section-label-row .line {
            flex: 1;
            height: 1px;

            background: var(--foreground);

            transform: scaleX(0);

            transition:
                transform
                1s
                cubic-bezier(.16,1,.3,1);
        }

        section.visible
        .section-label-row
        .line {
            transform: scaleX(1);
        }

        .section-label {
            white-space: nowrap;

            font-size: 10px;

            text-transform: uppercase;
            letter-spacing: .3em;

            color: var(--muted);

            opacity: 0;
            transform: translateY(6px);

            transition:
                opacity .6s ease .25s,
                transform .6s ease .25s;
        }

        section.visible
        .section-label {
            opacity: 1;
            transform: translateY(0);
        }

        .section-intro {
            text-align: center;
            margin-bottom: 48px;
        }

        .section-title {
            margin: 0 0 12px;

            font-family: var(--serif);

            font-size:
                clamp(34px, 5vw, 50px);

            line-height: 1.05;
            letter-spacing: -.03em;

            font-weight: 700;

            opacity: 0;
            transform: translateY(20px);

            transition:
                opacity .7s ease .18s,
                transform .7s
                cubic-bezier(.16,1,.3,1)
                .18s;
        }

        section.visible
        .section-title {
            opacity: 1;
            transform: translateY(0);
        }

        .section-description {
            max-width: 540px;

            margin: 0 auto;

            color: var(--muted);

            font-family: var(--serif);

            font-size: 16px;
            font-style: italic;

            opacity: 0;
            transform: translateY(14px);

            transition:
                opacity .7s ease .3s,
                transform .7s ease .3s;
        }

        section.visible
        .section-description {
            opacity: 1;
            transform: translateY(0);
        }


        /* =========================================================
           FORM
           ========================================================= */

        .visitor-form-wrapper {
            position: relative;

            border:
                2px solid var(--foreground);

            background:
                var(--surface);

            opacity: 0;
            transform: translateY(20px);

            transition:
                opacity .8s
                cubic-bezier(.16,1,.3,1)
                .35s,

                transform .8s
                cubic-bezier(.16,1,.3,1)
                .35s,

                box-shadow .35s ease;
        }

        section.visible
        .visitor-form-wrapper {
            opacity: 1;
            transform: translateY(0);
        }

        .visitor-form-wrapper:hover {
            box-shadow:
                5px 5px 0 var(--border);

            transform:
                translate(-2px, -2px);
        }

        .visitor-form {
            padding: 32px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .field-label {
            display: block;

            margin-bottom: 9px;

            font-size: 10px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: .2em;
        }

        .field-input,
        .field-textarea {
            width: 100%;

            border:
                1px solid var(--foreground);

            border-radius: 0;

            background:
                var(--background);

            color:
                var(--foreground);

            padding:
                13px 14px;

            outline: none;

            transition:
                background .25s ease,
                box-shadow .25s ease,
                transform .25s ease;
        }

        .field-input {
            min-height: 48px;
        }

        .field-textarea {
            min-height: 155px;
            resize: vertical;
        }

        .field-input:hover,
        .field-textarea:hover {
            background:
                #fffdfa;
        }

        .field-input:focus,
        .field-textarea:focus {
            background:
                #fff;

            box-shadow:
                4px 4px 0 var(--foreground);

            transform:
                translate(-1px, -1px);
        }

        .form-footer {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-top: 25px;

            padding-top: 24px;

            border-top:
                1px solid var(--border);
        }

        .form-note {
            margin: 0;

            color: var(--muted);

            font-family: var(--serif);

            font-size: 13px;
            font-style: italic;
        }

        .submit-button {
            position: relative;
            overflow: hidden;

            border:
                2px solid var(--foreground);

            border-radius: 0;

            background:
                var(--foreground);

            color:
                var(--background);

            padding:
                13px 20px;

            cursor: pointer;

            font-size: 10px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: .18em;

            box-shadow:
                4px 4px 0 var(--muted);

            transition:
                transform .2s
                cubic-bezier(.16,1,.3,1),

                box-shadow .2s
                cubic-bezier(.16,1,.3,1);
        }

        .submit-button:disabled {
            opacity: .55;
            cursor: wait;
        }

        .submit-button::after {
            content: "";

            position: absolute;

            top: -25%;
            left: 0;

            width: 24%;
            height: 150%;

            background:
                rgba(255,255,255,.23);

            transform:
                translateX(-130%)
                skewX(-20deg);
        }

        .submit-button:hover::after {
            animation:
                shine
                .75s
                cubic-bezier(.16,1,.3,1)
                both;
        }

        .submit-button:hover {
            transform:
                translate(-2px, -2px);

            box-shadow:
                6px 6px 0 var(--muted);
        }

        .submit-button:active {
            transform:
                translate(2px, 2px);

            box-shadow:
                2px 2px 0 var(--muted);
        }


        /* =========================================================
           STATUS
           ========================================================= */

        .form-status {
            display: none;

            margin-top: 18px;
            padding: 12px 14px;

            border:
                1px solid var(--foreground);

            font-family: var(--mono);
            font-size: 11px;

            animation:
                floatIn
                .35s
                ease
                both;
        }

        .form-status.visible {
            display: block;
        }


        /* =========================================================
           VISITOR GRID
           ========================================================= */

        .visitor-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            border:
                2px solid var(--foreground);

            overflow: hidden;
        }

        .visitor-entry {
            position: relative;

            padding: 25px;
            min-height: 185px;

            background:
                var(--surface);

            border-bottom:
                1px solid var(--foreground);

            opacity: 0;
            transform: translateY(24px);

            transition:
                opacity .7s
                cubic-bezier(.16,1,.3,1),

                transform .7s
                cubic-bezier(.16,1,.3,1),

                background .3s ease,

                box-shadow .3s ease;
        }

        .visitor-entry.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .visitor-entry:hover {
            background:
                #fffdfa;

            box-shadow:
                inset
                0
                0
                0
                2px
                var(--foreground);

            transform:
                translateY(-3px);
        }

        .visitor-entry::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 0;
            height: 2px;

            background:
                var(--foreground);

            transition:
                width
                .4s
                cubic-bezier(.16,1,.3,1);
        }

        .visitor-entry:hover::before {
            width: 100%;
        }


        /* =========================================================
           PINNED MESSAGE
           ========================================================= */

        .visitor-entry.is-pinned {
            background:
                var(--pinned-surface);

            box-shadow:
                inset
                0
                0
                0
                2px
                var(--foreground);
        }

        .visitor-entry.is-pinned::before {
            width: 100%;
        }

        .visitor-entry.is-pinned:hover {
            background:
                #e7e3d9;
        }

        .pinned-label {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 14px;

            font-family:
                var(--sans);

            font-size: 9px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: .2em;
        }

        .pin-icon {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            font-size: 8px;

            transform:
                rotate(45deg);
        }

        .visitor-entry.is-pinned
        .visitor-name {
            text-decoration:
                underline;

            text-decoration-thickness:
                1px;

            text-underline-offset:
                5px;
        }


        /* =========================================================
           VISITOR DETAILS
           ========================================================= */

        .visitor-meta {
            display: flex;

            align-items: center;
            gap: 10px;

            margin-bottom: 13px;

            flex-wrap: wrap;
        }

        .visitor-date,
        .visitor-time {
            font-size: 10px;

            text-transform: uppercase;
            letter-spacing: .18em;

            color:
                var(--muted);
        }

        .visitor-dot {
            color:
                var(--muted-light);
        }

        .visitor-name {
            margin: 0 0 9px;

            font-family:
                var(--serif);

            font-size: 21px;
            line-height: 1.2;

            font-weight: 700;

            transition:
                transform .3s
                cubic-bezier(.16,1,.3,1);
        }

        .visitor-entry:hover
        .visitor-name {
            transform:
                translateX(4px);
        }

        .visitor-message {
            margin: 0;

            font-family:
                var(--serif);

            font-size: 14px;
            line-height: 1.7;

            font-style: italic;

            color:
                var(--muted);

            white-space:
                pre-line;

            overflow-wrap:
                anywhere;
        }

        .visitor-empty {
            grid-column:
                1 / -1;

            padding:
                55px 25px;

            text-align:
                center;

            background:
                var(--surface);
        }

        .visitor-empty p {
            margin: 0;

            font-family:
                var(--serif);

            font-size: 16px;

            font-style:
                italic;

            color:
                var(--muted);

            animation:
                subtlePulse
                3s
                ease-in-out
                infinite;
        }


        /* =========================================================
           FOOTER
           ========================================================= */

        footer {
            padding:
                55px
                0
                50px;

            opacity: 0;
            transform:
                translateY(20px);

            transition:
                opacity .8s ease,
                transform .8s ease;
        }

        footer.visible {
            opacity: 1;
            transform:
                translateY(0);
        }

        .footer-inner {
            text-align:
                center;
        }

        .footer-brand {
            margin:
                0 0 7px;

            font-family:
                var(--serif);

            font-size:
                22px;

            font-weight:
                700;

            transition:
                letter-spacing
                .35s ease;
        }

        .footer-brand:hover {
            letter-spacing:
                .04em;
        }

        .footer-meta {
            margin:
                0 0 17px;

            font-size:
                11px;

            text-transform:
                uppercase;

            letter-spacing:
                .3em;

            color:
                var(--muted);
        }

        .footer-note {
            margin:
                0;

            font-size:
                11px;

            color:
                var(--muted);
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 700px) {

            .container {
                width:
                    min(
                        calc(100% - 24px),
                        var(--max-width)
                    );
            }

            header {
                padding-top:
                    30px;
            }

            section {
                padding:
                    62px
                    0;
            }

            .visitor-grid {
                grid-template-columns:
                    1fr;
            }

            .visitor-entry {
                border-right:
                    0 !important;

                border-bottom:
                    1px solid
                    var(--foreground);
            }

            .visitor-entry:last-child {
                border-bottom:
                    0;
            }

            .form-footer {
                align-items:
                    stretch;

                flex-direction:
                    column;
            }

            .submit-button {
                width:
                    100%;
            }

            .section-label-row {
                gap:
                    10px;
            }

            .section-label {
                font-size:
                    8px;

                letter-spacing:
                    .2em;
            }
        }


        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior:
                    auto;
            }

            *,
            *::before,
            *::after {
                animation:
                    none !important;

                transition:
                    none !important;
            }

            section,
            footer {
                opacity:
                    1;

                transform:
                    none;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header>

        <div class="container">

            <div class="header-inner">

                <div
                    class="rule-ornament header-rule"
                ></div>


                <div class="eyebrow">
                    Visitor Registry
                </div>


                <h1 class="site-title">

                    <span
                        id="siteTitle"
                    ></span>:

                    <em
                        id="siteName"
                    ></em>

                </h1>


                <p
                    class="site-subtitle"
                    id="siteSubtitle"
                ></p>

            </div>

        </div>

    </header>


    <!-- =========================================================
         MAIN
         ========================================================= -->

    <main>


        <!-- =====================================================
             SIGN THE REGISTRY
             ===================================================== -->

        <section id="sign">

            <div class="container">


                <div class="section-label-row">

                    <div class="line"></div>

                    <span class="section-label">
                        01 · Sign the Registry
                    </span>

                    <div class="line"></div>

                </div>


                <div class="section-intro">

                    <h2
                        class="section-title"
                        id="formHeading"
                    ></h2>


                    <p
                        class="section-description"
                        id="formDescription"
                    ></p>

                </div>


                <div
                    class="visitor-form-wrapper"
                >

                    <form
                        class="visitor-form"
                        id="visitorForm"
                    >


                        <div class="form-grid">


                            <div>

                                <label
                                    class="field-label"
                                    for="visitorName"
                                >
                                    Your Name
                                </label>


                                <input
                                    class="field-input"
                                    id="visitorName"
                                    type="text"
                                    name="name"
                                    maxlength="80"
                                    autocomplete="name"
                                    placeholder="Enter your name"
                                    required
                                >

                            </div>


                            <div>

                                <label
                                    class="field-label"
                                    for="visitorMessage"
                                >
                                    Message
                                </label>


                                <textarea
                                    class="field-textarea"
                                    id="visitorMessage"
                                    name="message"
                                    maxlength="1000"
                                    placeholder="Leave a message..."
                                    required
                                ></textarea>

                            </div>


                        </div>


                        <div
                            class="form-footer"
                        >


                            <p
                                class="form-note"
                            >
                                Messages are automatically checked before appearing publicly.
                            </p>


                            <button
                                class="submit-button"
                                type="submit"
                                id="submitButton"
                            >
                                Sign the Registry →
                            </button>


                        </div>


                        <div
                            class="form-status"
                            id="formStatus"
                            role="status"
                            aria-live="polite"
                        ></div>


                    </form>

                </div>

            </div>

        </section>


        <!-- =====================================================
             RECENT VISITORS
             ===================================================== -->

        <section id="visitors">

            <div class="container">


                <div class="section-label-row">

                    <div class="line"></div>

                    <span class="section-label">
                        02 · Recent Visitors
                    </span>

                    <div class="line"></div>

                </div>


                <div class="section-intro">

                    <h2
                        class="section-title"
                        id="visitorsHeading"
                    ></h2>


                    <p
                        class="section-description"
                        id="visitorsDescription"
                    ></p>

                </div>


                <div
                    class="visitor-grid"
                    id="visitorGrid"
                >

                    <div class="visitor-empty">

                        <p>
                            Loading visitors...
                        </p>

                    </div>

                </div>

            </div>

        </section>


    </main>


    <!-- =========================================================
         FOOTER
         ========================================================= -->

    <footer>

        <div class="container">

            <div class="footer-inner">


                <div class="rule-ornament"></div>


                <div
                    style="
                        padding-top: 30px;
                    "
                >

                    <p
                        class="footer-brand"
                        id="footerName"
                    ></p>


                    <p
                        class="footer-meta"
                        id="footerVolume"
                    ></p>


                    <p
                        class="footer-note"
                    >
                        Visitor Registry · All rights reserved.
                    </p>


                </div>

            </div>

        </div>

    </footer>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>

        /* =========================================================
           CHECK SUPABASE
           ========================================================= */

        const SUPABASE_READY =
            window.supabase &&
            SUPABASE_URL &&
            SUPABASE_ANON_KEY &&
            !SUPABASE_URL.includes(
                "YOUR-PROJECT"
            ) &&
            !SUPABASE_ANON_KEY.includes(
                "YOUR_PUBLIC"
            );


        const db =
            SUPABASE_READY
                ? window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_ANON_KEY
                )
                : null;


        /* =========================================================
           APPLY SITE SETTINGS
           ========================================================= */

        document
            .getElementById(
                "siteTitle"
            )
            .textContent =
                SITE.title;


        document
            .getElementById(
                "siteName"
            )
            .textContent =
                SITE.name;


        document
            .getElementById(
                "siteSubtitle"
            )
            .textContent =
                SITE.subtitle;


        document
            .getElementById(
                "formHeading"
            )
            .textContent =
                SITE.formHeading;


        document
            .getElementById(
                "formDescription"
            )
            .textContent =
                SITE.formDescription;


        document
            .getElementById(
                "visitorsHeading"
            )
            .textContent =
                SITE.visitorsHeading;


        document
            .getElementById(
                "visitorsDescription"
            )
            .textContent =
                SITE.visitorsDescription;


        document
            .getElementById(
                "footerName"
            )
            .textContent =
                SITE.footerName;


        document
            .getElementById(
                "footerVolume"
            )
            .textContent =
                SITE.footerVolume;


        /* =========================================================
           TEXT NORMALIZATION
           ========================================================= */

        function normalizeUnicode(text) {

            return String(text)
                .normalize("NFKC")
                .replace(
                    /[\u200B-\u200D\uFEFF]/g,
                    ""
                );
        }


        function removeDiacritics(text) {

            return text
                .normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                );
        }


        function convertLeetspeak(text) {

            return text
                .replace(/@/g, "a")
                .replace(/4/g, "a")
                .replace(/8/g, "b")
                .replace(/3/g, "e")
                .replace(/1/g, "i")
                .replace(/!/g, "i")
                .replace(/0/g, "o")
                .replace(/5/g, "s")
                .replace(/\$/g, "s")
                .replace(/7/g, "t")
                .replace(/9/g, "g");
        }


        function collapseRepeatedCharacters(text) {

            return text.replace(
                /(.)\1+/g,
                "$1"
            );
        }


        function makeSearchable(text) {

            let result =
                normalizeUnicode(text);

            result =
                removeDiacritics(result);

            result =
                convertLeetspeak(result);

            result =
                result.toLowerCase();

            result =
                result.replace(
                    /[^a-z0-9\s]/g,
                    ""
                );

            result =
                collapseRepeatedCharacters(
                    result
                );

            return result
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();
        }


        function makeCompactSearchable(text) {

            return makeSearchable(text)
                .replace(
                    /\s+/g,
                    ""
                );
        }


        /* =========================================================
           MODERATION HELPERS
           ========================================================= */

        function countUrls(text) {

            const matches =
                text.match(
                    /(?:https?:\/\/|www\.|ftp:\/\/)[^\s]+/gi
                );

            return matches
                ? matches.length
                : 0;
        }


        function containsEmail(text) {

            return /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
                .test(text);
        }


        function containsPhoneNumber(text) {

            const digits =
                text.replace(
                    /\D/g,
                    ""
                );

            return (
                digits.length >= 10 &&
                digits.length <= 15
            );
        }


        function hasExcessiveRepeatedCharacters(text) {

            return new RegExp(
                `(.)\\1{${MAX_REPEATED_CHARACTER - 1},}`,
                "u"
            ).test(text);
        }


        function countSuspiciousPunctuation(text) {

            const matches =
                text.match(
                    /[!?]{2,}/g
                );

            if (!matches) {
                return 0;
            }

            return matches.join("").length;
        }


        function containsBlockedTerm(
            searchable,
            compact
        ) {

            for (
                const term
                of BLOCKED_WORDS
            ) {

                const normalizedTerm =
                    makeSearchable(term);

                const compactTerm =
                    makeCompactSearchable(term);

                if (
                    normalizedTerm &&
                    searchable.includes(
                        normalizedTerm
                    )
                ) {
                    return term;
                }

                if (
                    compactTerm.length >= 4 &&
                    compact.includes(
                        compactTerm
                    )
                ) {
                    return term;
                }
            }

            return null;
        }


        function containsReviewPhrase(searchable) {

            for (
                const phrase
                of REVIEW_PHRASES
            ) {

                const normalized =
                    makeSearchable(phrase);

                if (
                    searchable.includes(
                        normalized
                    )
                ) {
                    return phrase;
                }
            }

            return null;
        }


        function matchesHardReject(text) {

            return HARD_REJECT_PATTERNS.some(
                pattern =>
                    pattern.test(text)
            );
        }


        /* =========================================================
           SMART MODERATION
           ========================================================= */

        function moderateMessage(
            name,
            message
        ) {

            const combined =
                `${name} ${message}`;

            const searchable =
                makeSearchable(combined);

            const compact =
                makeCompactSearchable(combined);

            const reasons = [];

            let action =
                MODERATE_EVERY_MESSAGE
                    ? "review"
                    : "allow";


            if (
                matchesHardReject(
                    combined
                )
            ) {

                return {
                    action: "reject",

                    reasons: [
                        "Unsafe HTML or script pattern detected."
                    ]
                };
            }


            const blockedTerm =
                containsBlockedTerm(
                    searchable,
                    compact
                );

            if (blockedTerm) {

                reasons.push(
                    `Blocked term detected: ${blockedTerm}`
                );

                action = "reject";
            }


            if (
                hasExcessiveRepeatedCharacters(
                    combined
                )
            ) {

                reasons.push(
                    "Excessive repeated characters."
                );

                action = "review";
            }


            const urlCount =
                countUrls(combined);

            if (
                REVIEW_URLS &&
                urlCount > 0
            ) {

                reasons.push(
                    `${urlCount} link(s) detected.`
                );

                action = "review";
            }


            if (
                urlCount > MAX_URLS
            ) {

                reasons.push(
                    "Too many links."
                );

                action = "reject";
            }


            if (
                containsEmail(combined)
            ) {

                reasons.push(
                    "Email address detected."
                );

                action = "review";
            }


            if (
                containsPhoneNumber(combined)
            ) {

                reasons.push(
                    "Possible phone number detected."
                );

                action = "review";
            }


            const spamPhrase =
                containsReviewPhrase(
                    searchable
                );

            if (spamPhrase) {

                reasons.push(
                    `Promotional phrase detected: ${spamPhrase}`
                );

                action = "review";
            }


            const punctuation =
                countSuspiciousPunctuation(
                    combined
                );

            if (
                punctuation > MAX_PUNCTUATION
            ) {

                reasons.push(
                    "Excessive punctuation."
                );

                action = "review";
            }


            if (
                /[A-Za-z0-9]{45,}/.test(
                    combined
                )
            ) {

                reasons.push(
                    "Suspicious unbroken text detected."
                );

                action = "review";
            }


            const compactMessage =
                makeCompactSearchable(
                    message
                );

            if (
                message.length > 30 &&
                new Set(
                    compactMessage
                ).size < 6
            ) {

                reasons.push(
                    "Highly repetitive message."
                );

                action = "review";
            }


            return {
                action,
                reasons
            };
        }


        /* =========================================================
           CENSOR
           ========================================================= */

        function censorText(text) {

            let result =
                String(text);

            for (
                const term
                of BLOCKED_WORDS
            ) {

                if (!term.trim()) {
                    continue;
                }

                const escaped =
                    term.replace(
                        /[.*+?^${}()|[\]\\]/g,
                        "\\$&"
                    );

                const pattern =
                    new RegExp(
                        escaped,
                        "gi"
                    );

                result =
                    result.replace(
                        pattern,
                        match =>
                            "█".repeat(
                                Math.min(
                                    match.length,
                                    12
                                )
                            )
                    );
            }

            return result;
        }


        /* =========================================================
           SECURITY
           ========================================================= */

        function escapeHTML(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* =========================================================
           DATE FORMATTING
           ========================================================= */

        function formatDate(timestamp) {

            return new Date(
                timestamp
            ).toLocaleDateString(
                undefined,
                {
                    month:
                        "short",

                    day:
                        "numeric",

                    year:
                        "numeric"
                }
            );
        }


        function formatTime(timestamp) {

            return new Date(
                timestamp
            ).toLocaleTimeString(
                undefined,
                {
                    hour:
                        "numeric",

                    minute:
                        "2-digit"
                }
            );
        }


        /* =========================================================
           GET VISITORS
           ========================================================= */

        async function getVisitors() {

            if (!db) {
                return [];
            }

            const {
                data,
                error
            } = await db

                .from(
                    "messages"
                )

                .select(
                    "id,name,message,created_at,pinned"
                )

                .eq(
                    "status",
                    "approved"
                )

                .order(
                    "pinned",
                    {
                        ascending:
                            false
                    }
                )

                .order(
                    "created_at",
                    {
                        ascending:
                            false
                    }
                )

                .limit(
                    100
                );


            if (error) {

                console.error(
                    "Could not load visitors:",
                    error
                );

                return [];
            }


            return data || [];
        }


        /* =========================================================
           GRID BORDERS
           ========================================================= */

        function updateGridBorders() {

            const entries =
                document.querySelectorAll(
                    ".visitor-entry"
                );


            entries.forEach(entry => {

                entry.style.borderRight =
                    "1px solid var(--foreground)";

                entry.style.borderBottom =
                    "1px solid var(--foreground)";

            });


            if (!entries.length) {
                return;
            }


            if (
                window.innerWidth <= 700
            ) {

                entries.forEach(entry => {

                    entry.style.borderRight =
                        "0";

                });


                entries[
                    entries.length - 1
                ].style.borderBottom =
                    "0";

                return;
            }


            entries.forEach(
                (
                    entry,
                    index
                ) => {

                    if (
                        (index + 1) % 2 === 0
                    ) {

                        entry.style.borderRight =
                            "0";
                    }

                    if (
                        index >=
                        entries.length - 2
                    ) {

                        entry.style.borderBottom =
                            "0";
                    }
                }
            );
        }


        /* =========================================================
           RENDER VISITORS
           ========================================================= */

        async function renderVisitors() {

            const grid =
                document.getElementById(
                    "visitorGrid"
                );


            if (!db) {

                grid.innerHTML = `
                    <div class="visitor-empty">
                        <p>
                            Visitor database is not configured yet.
                        </p>
                    </div>
                `;

                return;
            }


            grid.innerHTML = `
                <div class="visitor-empty">
                    <p>
                        Loading visitors...
                    </p>
                </div>
            `;


            const visitors =
                await getVisitors();


            if (!visitors.length) {

                grid.innerHTML = `
                    <div class="visitor-empty">
                        <p>
                            No visitors have signed the
                            registry yet. Be the first.
                        </p>
                    </div>
                `;

                return;
            }


            grid.innerHTML =
                visitors
                    .map(
                        (
                            visitor,
                            index
                        ) => {

                            const safeMessage =
                                censorText(
                                    visitor.message
                                );


                            return `
                                <article
                                    class="
                                        visitor-entry
                                        ${
                                            visitor.pinned
                                                ? "is-pinned"
                                                : ""
                                        }
                                    "
                                    style="
                                        transition-delay:
                                        ${index * 90}ms;
                                    "
                                >

                                    ${
                                        visitor.pinned
                                            ? `
                                                <div
                                                    class="
                                                        pinned-label
                                                    "
                                                >
                                                    <span
                                                        class="
                                                            pin-icon
                                                        "
                                                    >
                                                        ◆
                                                    </span>

                                                    Pinned
                                                </div>
                                              `
                                            : ""
                                    }


                                    <div
                                        class="
                                            visitor-meta
                                        "
                                    >

                                        <span
                                            class="
                                                visitor-date
                                            "
                                        >
                                            ${escapeHTML(
                                                formatDate(
                                                    visitor.created_at
                                                )
                                            )}
                                        </span>


                                        <span
                                            class="
                                                visitor-dot
                                            "
                                        >
                                            ·
                                        </span>


                                        <span
                                            class="
                                                visitor-time
                                            "
                                        >
                                            ${escapeHTML(
                                                formatTime(
                                                    visitor.created_at
                                                )
                                            )}
                                        </span>

                                    </div>


                                    <h3
                                        class="
                                            visitor-name
                                        "
                                    >
                                        ${escapeHTML(
                                            visitor.name
                                        )}
                                    </h3>


                                    <p
                                        class="
                                            visitor-message
                                        "
                                    >
                                        ${escapeHTML(
                                            safeMessage
                                        )}
                                    </p>

                                </article>
                            `;
                        }
                    )
                    .join("");


            requestAnimationFrame(() => {

                document
                    .querySelectorAll(
                        ".visitor-entry"
                    )
                    .forEach(
                        entry => {
                            entry.classList.add(
                                "visible"
                            );
                        }
                    );


                updateGridBorders();
            });
        }


        /* =========================================================
           ANALYTICS
           ========================================================= */

        async function trackEvent(
            eventType
        ) {

            if (!db) {
                return;
            }


            try {

                const sessionKey =
                    "visitor_session_id";


                let sessionId =
                    localStorage.getItem(
                        sessionKey
                    );


                if (!sessionId) {

                    sessionId =
                        crypto.randomUUID();

                    localStorage.setItem(
                        sessionKey,
                        sessionId
                    );
                }


                await db

                    .from(
                        "analytics_events"
                    )

                    .insert({
                        event_type:
                            eventType,

                        session_id:
                            sessionId,

                        page:
                            location.pathname,

                        referrer:
                            document.referrer ||
                            null,

                        user_agent:
                            navigator.userAgent
                    });

            }
            catch (error) {

                console.debug(
                    "Analytics unavailable."
                );
            }
        }


        /* =========================================================
           FORM
           ========================================================= */

        const visitorForm =
            document.getElementById(
                "visitorForm"
            );


        const formStatus =
            document.getElementById(
                "formStatus"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        let formOpened =
            false;


        document
            .getElementById(
                "visitorName"
            )
            .addEventListener(
                "focus",
                () => {

                    if (!formOpened) {

                        formOpened =
                            true;

                        trackEvent(
                            "form_open"
                        );
                    }
                }
            );


        visitorForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById(
                            "visitorName"
                        )
                        .value
                        .trim();


                const message =
                    document
                        .getElementById(
                            "visitorMessage"
                        )
                        .value
                        .trim();


                if (!name || !message) {

                    showStatus(
                        "Please enter your name and a message."
                    );

                    return;
                }


                if (name.length > 80) {

                    showStatus(
                        "Your name is too long."
                    );

                    return;
                }


                if (message.length > 1000) {

                    showStatus(
                        "Your message is too long."
                    );

                    return;
                }


                if (!db) {

                    showStatus(
                        "The visitor database is not configured."
                    );

                    return;
                }


                const moderation =
                    moderateMessage(
                        name,
                        message
                    );


                if (
                    moderation.action ===
                    "reject"
                ) {

                    trackEvent(
                        "submission_rejected"
                    );

                    showStatus(
                        "Your message could not be submitted."
                    );

                    return;
                }


                submitButton.disabled =
                    true;

                submitButton.textContent =
                    "Submitting…";


                try {

                    const initialStatus = "approved";


                    const {
                        error
                    } = await db

                        .from(
                            "messages"
                        )

                        .insert({
                            name:
                                name,

                            message:
                                message,

                            status:
                                initialStatus,

                            moderation_reason:
                                moderation.reasons.length
                                    ? moderation.reasons.join(
                                        " "
                                    )
                                    : null
                        });


                    if (error) {

                        console.error(
                            error
                        );

                        throw new Error(
                            "The message could not be submitted."
                        );
                    }


                    visitorForm.reset();


                    if (
                        initialStatus ===
                        "pending"
                    ) {

                        trackEvent(
                            "submission_pending"
                        );

                        showStatus(
                            "Thanks! Your message was received and is awaiting review."
                        );

                    }
                    else {

                        trackEvent(
                            "submission_approved"
                        );

                        showStatus(
                            "Your message has been added to the registry."
                        );
                    }


                    await renderVisitors();


                    setTimeout(
                        () => {

                            document
                                .getElementById(
                                    "visitors"
                                )
                                .scrollIntoView({
                                    behavior:
                                        "smooth"
                                });

                        },
                        250
                    );


                }
                catch (error) {

                    console.error(
                        error
                    );

                    showStatus(
                        error.message ||
                        "Something went wrong."
                    );

                }
                finally {

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Sign the Registry →";
                }
            }
        );


        /* =========================================================
           STATUS
           ========================================================= */

        function showStatus(
            message
        ) {

            formStatus.textContent =
                message;

            formStatus.classList.add(
                "visible"
            );


            setTimeout(
                () => {

                    formStatus.classList.remove(
                        "visible"
                    );

                },
                5000
            );
        }


        /* =========================================================
           SCROLL REVEALS
           ========================================================= */

        const revealElements =
            document.querySelectorAll(
                "section, footer"
            );


        const observer =
            new IntersectionObserver(
                entries => {

                    entries.forEach(
                        entry => {

                            if (
                                entry.isIntersecting
                            ) {

                                entry
                                    .target
                                    .classList
                                    .add(
                                        "visible"
                                    );

                                observer.unobserve(
                                    entry.target
                                );
                            }
                        }
                    );

                },
                {
                    threshold:
                        .12,

                    rootMargin:
                        "0px 0px -50px 0px"
                }
            );


        revealElements.forEach(
            element => {

                observer.observe(
                    element
                );
            }
        );


        /* =========================================================
           RESIZE
           ========================================================= */

        window.addEventListener(
            "resize",
            updateGridBorders
        );


        /* =========================================================
           INITIALIZE
           ========================================================= */

        trackEvent(
            "page_view"
        );

        renderVisitors();

    </script>
